# ── Render Keep-Alive ──
# Pings the Render URL every 10 minutes to prevent the free tier
# from spinning down after 15 minutes of inactivity.
# First visit may still take ~5s to warm up, but subsequent visits
# will be instant while this workflow is running.

name: Keep Alive

on:
  schedule:
    # Every 10 minutes — Render spins down after 15min idle
    - cron: '*/10 * * * *'
  workflow_dispatch:  # manual trigger for testing

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render
        run: curl -s -o /dev/null -w "%{http_code}" https://memory-mines.onrender.com/healthz
